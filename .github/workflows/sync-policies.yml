name: Sync policy list

on:
  schedule:
    - cron: "0 0 * * *" # daily, 08:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-policies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync from the XPolicyLab README
        run: python3 scripts/sync_policies.py

      - name: Commit changes
        run: |
          git add index.html js/main.js data/policies.json
          if git diff --cached --quiet; then
            echo "Policy list is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync policy list from XPolicyLab"
          git push
